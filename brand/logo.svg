<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <clipPath id="rounded">
      <rect x="0" y="0" width="500" height="500" rx="110" ry="110"/>
    </clipPath>
  </defs>

  <!-- Blue background -->
  <rect x="0" y="0" width="500" height="500" rx="110" fill="#0b3d91"/>

  <!-- Diagonal Seychelles flag fan -->
  <g clip-path="url(#rounded)">
    <polygon points="0,500 0,345 207,0 345,0" fill="#fcd116"/>
    <polygon points="0,500 345,0 500,0 500,115" fill="#d62828"/>
    <polygon points="0,500 500,115 500,285" fill="#ffffff"/>
    <polygon points="0,500 500,285 500,500" fill="#0a7d3e"/>
  </g>

  <!-- Black outline (slightly thicker) -->
  <text
    x="250"
    y="330"
    font-family="Arial Black, Impact, sans-serif"
    font-weight="900"
    font-size="230"
    fill="none"
    stroke="#000000"
    stroke-width="6"
    stroke-linejoin="round"
    text-anchor="middle"
  >BS</text>

  <!-- White letters on top -->
  <text
    x="250"
    y="330"
    font-family="Arial Black, Impact, sans-serif"
    font-weight="900"
    font-size="230"
    fill="white"
    text-anchor="middle"
  >BS</text>
</svg>
